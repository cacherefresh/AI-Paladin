# Publish the pip package with PyPI Trusted Publishing (OIDC).
# No API token is stored in the repository or as a GitHub secret.
# Only Rob creates the TestPyPI/PyPI pending publishers and the
# GitHub environments, and only Rob approves a production upload.
# The click-by-click steps are in docs/RELEASING.md.
#
# TestPyPI: dispatch this workflow from `development` or `sanctuary`
# (target=testpypi). A workflow_dispatch workflow has to exist on
# the default branch (`sanctuary`) before GitHub will let you start
# it; that is why this file is also on sanctuary. The Lead Engineer
# GitHub App cannot start workflow runs, so Rob starts them from
# the Actions tab (Release > Run workflow).
# PyPI: push a v* tag (for example v0.3.0). The publish-pypi job
# waits for approval on the `pypi` GitHub environment.

name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish destination. Only TestPyPI is allowed from a manual run; production PyPI is published by pushing a v* tag."
        required: true
        type: choice
        options:
          - testpypi
        default: testpypi
      prerelease:
        description: "Optional PEP 440 suffix for a TestPyPI redo only (rc1 or dev1). Leave empty to use the VERSION file as-is. Do not change VERSION."
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build twine

      - name: Check VERSION and apply optional TestPyPI suffix
        id: version
        env:
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || '' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, sys
          from pathlib import Path

          raw = Path("VERSION").read_text(encoding="utf-8")
          lines = [ln.strip() for ln in raw.splitlines()
                   if ln.strip() and not ln.strip().startswith("#")]
          if not lines:
              sys.exit("VERSION is empty")
          base = lines[0]
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              sys.exit(f"VERSION must be X.Y.Z, got {base!r}")

          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          if ref_type == "tag":
              expected = "v" + base
              if ref_name != expected:
                  sys.exit(
                      f"Tag {ref_name} does not match VERSION {base} "
                      f"(expected {expected}). Tags are v plus the VERSION "
                      "file; do not retag a TestPyPI redo suffix."
                  )
              print(f"tag {ref_name} matches VERSION {base}")
              version = base
          else:
              suffix = os.environ.get("PRERELEASE", "").strip()
              if not suffix:
                  version = base
              else:
                  s = suffix.lstrip(".").lower()
                  if re.fullmatch(r"rc\d+", s):
                      version = base + s
                  elif re.fullmatch(r"dev\d+", s):
                      version = base + ".dev" + s[3:]
                  elif re.fullmatch(r"[ab]\d+", s):
                      version = base + s
                  else:
                      sys.exit(
                          f"unsupported prerelease suffix {suffix!r}; "
                          "use rc1, dev1, a1 or b1"
                      )
                  Path("VERSION").write_text(version + "\n", encoding="utf-8")
                  print(
                      f"VERSION file in this run only is {version} "
                      "(not committed)"
                  )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as fh:
              fh.write(f"version={version}\n")
          print(f"package version for this build: {version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check --strict
        run: python -m twine check --strict dist/*

      - name: Confirm artifact version and no repo-only docs
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'PY'
          import os, tarfile, zipfile
          from email import message_from_bytes
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)

          forbidden = ("AGENTS.md", "CLAUDE.md", "HANDOFF.md")
          also_forbid = ("HUMAN_C_SUITE_DOCUMENTATION", "PITCH_DECK")

          def leak(names):
              bad = []
              for n in names:
                  parts = n.replace("\\", "/").split("/")
                  if any(p in forbidden or p in also_forbid for p in parts):
                      bad.append(n)
              return bad

          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              meta = message_from_bytes(
                  z.read(next(n for n in names if n.endswith("METADATA")))
              )
              ver = meta["Version"]
              leaked = leak(names)
          assert ver == expected, f"wheel version {ver} != {expected}"
          assert not leaked, f"repo-only files in wheel: {leaked}"

          with tarfile.open(sdists[0], "r:gz") as t:
              snames = t.getnames()
              leaked = leak(snames)
              pkg = next(n for n in snames if n.endswith("PKG-INFO"))
              info = message_from_bytes(t.extractfile(pkg).read())
          assert not leaked, f"repo-only files in sdist: {leaked}"
          assert info["Version"] == expected, (
              f"sdist version {info['Version']} != {expected}"
          )
          print(
              f"artifacts ok: {wheels[0].name}, {sdists[0].name}, "
              f"version {expected}"
          )
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && (github.ref == 'refs/heads/sanctuary' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ai-paladin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-paladin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
