# Tests for the pip / PyPI package. VS Code extension and Ubuntu PPA builds
# get their own workflows on their own branches.
name: CI

on:
  push:
    branches: [sanctuary, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable)
        run: python -m pip install -e .
      - name: Unit tests
        working-directory: ai-org-router
        run: python -m unittest discover -s tests -v

  wheel:
    name: wheel installs into a clean venv (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install "PyYAML>=6"
      - name: Build, install and boot the wheel
        working-directory: ai-org-router
        env:
          AI_PALADIN_WHEEL_TEST: "1"
        run: python -m unittest tests.test_wheel_install -v
