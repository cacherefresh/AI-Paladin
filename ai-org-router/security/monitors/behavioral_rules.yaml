# =============================================================================
# BEHAVIOURAL RULES
# =============================================================================
# Each rule states, under `enforced:`, exactly where it is enforced and how -
# or that it is not. Two enforcers read this file:
#
#   router  ai_paladin/security/monitors.py, used by the on-prem model's web
#           tools and file reads.
#   hook    ai_paladin/hook.py, the Claude Code PreToolUse hook - only when it
#           is installed (hooks/README.md).
#
# Neither can kill a process. "kill_agent" is carried out as the strongest
# thing each enforcer can do: the hook refuses the tool call, the router
# withholds the file or stops the task's web tools. Each `enforced:` line says
# which.
#
# A copy of this file in your settings folder replaces it whole.
# =============================================================================
rules:
  - id: mass-file-touch
    desc: ">200 file writes/renames in 60s (ransomware signature)"
    severity: critical
    action: kill_agent_and_alert
    max_writes: 200
    window_s: 60
    enforced: "hook: counts Write/Edit/MultiEdit/NotebookEdit calls per session; past the limit, every further write is refused and logged. Bash renames are not counted."

  - id: extension-rewrite-spread
    desc: "writes changing extensions across >20 files in 5m"
    severity: critical
    action: kill_agent_and_alert
    enforced: "NOT ENFORCED in v0.1.0 - needs file-system monitoring; tool calls alone do not show a rename's effect."

  - id: out-of-scope-path
    desc: "any access attempt outside task workspace"
    severity: high
    action: block_and_flag
    enforced: "hook: Write/Edit/MultiEdit/NotebookEdit outside commands.yaml write_scope are refused and logged. Reads and Bash commands are not scoped."

  - id: fence-probing
    desc: ">3 blocked-command retries in one task (agent testing the gates)"
    severity: high
    action: pause_agent_require_human
    max_blocked: 3
    enforced: "hook: after more than max_blocked refusals in one session, every tool call is refused until a person runs `ai-paladin-hook --release SESSION_ID`. router: after more than max_blocked refused web calls in one task, that task's web tools are stopped; the model still finishes its answer without the web."

  - id: unknown-egress
    desc: "network attempt to non-allowlisted domain"
    severity: high
    action: block_and_flag
    enforced: "router: only when internet_access.allow_domains in router/policy.yaml is non-empty - then any other host is refused and logged. Empty (the default) allows any public host on ports 80/443."

  - id: credential-path-access
    desc: "read attempt on ~/.ssh, ~/.aws, .env outside scope"
    severity: critical
    action: kill_agent_and_alert
    paths: ["**/.ssh/**", "**/.aws/**", "**/.env", "**/.env.*"]
    enforced: "router: files on these paths are never given to the on-prem model; a critical alert is raised. hook: Read/Grep/Glob/Edit/Write on these paths, and Bash commands naming .ssh/, .aws/ or .env, are refused."

  - id: backup-tamper
    desc: "any write/delete on backup or .git/objects paths"
    severity: critical
    action: kill_agent_and_alert
    enforced: "hook: through commands.yaml write_scope.deny - file-writing tools are refused there. A Bash rm or mv is not checked."

  - id: hook-tamper
    desc: "an agent trying to switch off or edit the guard that restrains it"
    severity: critical
    action: block_and_flag
    enforced: "hook: file-writing tools are refused on Claude Code's settings.json / settings.local.json and on AI-Paladin's config and log folders; Bash commands naming those, or running ai-paladin-hook --release / --install / --uninstall, ai-paladin uninstall, or pip uninstall ai-paladin, are refused. Only a person turns the guard off. Matching a shell command is a tripwire, not a sandbox."

triage:
  # NOT ENFORCED in v0.1.0 - there is no scheduled anomaly summary yet.
  local_model_summary: true
