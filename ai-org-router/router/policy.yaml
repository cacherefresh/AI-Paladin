# =============================================================================
# ROUTING POLICY - the four postures
# =============================================================================
# Every mode inherits the same non-negotiable invariant:
#
#     keyword match  ==>  on-prem.  always.  no override.
#
# The mode governs only what happens to NON-matching traffic.
# =============================================================================

version: 1

invariant:
  id: protected-ip-stays-home
  description: >
    Any prompt matching router/keywords.yaml is executed on-prem by
    dev-mistral-2. This decision is made before any network socket is opened
    and cannot be overridden by the user, by the mode, or by the model.
  overridable: false

nodes:
  onprem:
    label: on-prem
    node_id: onprem-01
    model: dev-mistral-2
    backend: ollama
    ollama_model: devstral-small-2:latest
    endpoint: http://localhost:11434
    keep_alive: 60m
  bigai:
    label: BIG-AI
    node_id: bigai-gateway
    model: BIG-AI
    backend: simulated
    simulated: true
    note: >
      No ANTHROPIC_API_KEY present. Adapter runs in simulated mode and is
      badged as such in the UI. Drop a key in and set backend to claude-api
      to make this leg real.

modes:

  - id: sovereign
    name: sovereign - Nothing leaves this machine
    tagline: The perimeter, not the routing table. No egress at any price.
    posture: sealed
    color: "#3b82f6"
    on_keyword_match: onprem          # invariant
    on_no_match: onprem               # there is nowhere else to go
    allow_escalation_offer: false     # nothing to offer
    require_confirmation_on_egress: false
    egress_payload: none
    seal_egress: true                 # <- arms security/egress_guard.py
    description: >
      Every other mode routes around the risk; this one removes the
      capability. While it is armed, security/egress_guard.py refuses any
      connection to a destination that is not this machine - before the
      connect() syscall, and including DNS, because resolving a name is
      itself a packet leaving. BIG-AI is not declined, it is unreachable.

      MVP scope is loopback only: 127.0.0.0/8, ::1 and AF_UNIX sockets. That
      is the deny-all-outbound rule at the host, not yet the LAN-scoped
      perimeter (a second on-prem node, a pooled GPU box) described in
      docs/ROADMAP.md section 5.

      Honest limit: this is a process-level guard, not a host firewall. It
      covers every socket this router opens; it does not cover the rest of
      the machine. Do not call it an air gap.

  - id: slow
    name: slow - Prefer on-prem whenever possible
    tagline: Acts like a firewall. Local first, always.
    posture: maximum-protection
    color: "#22c55e"
    on_keyword_match: onprem          # invariant
    on_no_match: onprem               # preference: stay home anyway
    allow_escalation_offer: true      # user may explicitly ask to escalate
    require_confirmation_on_egress: true
    egress_payload: full
    description: >
      Nothing leaves without a deliberate human decision. Non-matching work
      still runs locally; the UI offers escalation as an opt-in, never a
      default. Slowest, safest.

  - id: fast
    name: fast - Limit on-prem to Protected Alpha IP
    tagline: Big reasoning goes out. Protected IP never does.
    posture: balanced
    color: "#f59e0b"
    on_keyword_match: onprem          # invariant
    on_no_match: bigai
    allow_escalation_offer: false
    require_confirmation_on_egress: true
    egress_payload: full
    description: >
      Large reasoning tasks that carry no protected IP go to BIG-AI for speed
      and depth. Anything that trips the keyword gate is pinned on-prem.

  - id: superfast
    name: superfast - Risky
    tagline: Minimum viable payload, maximum disclosure.
    posture: speed-first
    color: "#ef4444"
    on_keyword_match: onprem          # invariant - still holds
    on_no_match: bigai
    allow_escalation_offer: false
    require_confirmation_on_egress: true
    egress_payload: minimal           # only the snippet needed for the fix
    require_full_disclosure: true     # show EXACTLY what bytes leave, first
    description: >
      Sends only the minimum slice of code needed to fix a small bug. Before
      anything leaves, a disclosure window itemises every file and every byte
      staged for egress. Fast, and honest about the trade.

# Token accounting. Rates are DELIBERATELY unset: AI-Paladin does not ship a
# vendor price list, because a stale one is worse than none. Set your own
# contracted rates here and the ledger will compute spend and avoided spend;
# leave them null and the ledger reports tokens only, never a guessed dollar.
pricing:
  price_per_mtok_in: null      # USD per 1M input tokens, your contracted rate
  price_per_mtok_out: null     # USD per 1M output tokens

defaults:
  mode: slow
  corpus: alpha-ip

  # Pin the node to one posture. Null means the mode bar is live and every
  # posture change is written to the audit log with the actor named. Set it to
  # a mode id (typically 'sovereign') and the router refuses every other mode
  # at the API, not just in the UI - a developer cannot click their way out of
  # a posture their organisation set.
  lock_mode: null

# Notification bus - mockup queue/topic. In-memory fan-out, JSONL audit sink.
notifications:
  topics:
    - id: egress.pending
      label: Awaiting human decision
      severity: warning
    - id: egress.approved
      label: Left on-prem for BIG-AI
      severity: warning
    - id: egress.denied
      label: Egress denied by human
      severity: info
    - id: egress.blocked
      label: Blocked by rules engine
      severity: critical
    - id: posture.sealed
      label: Sovereign posture armed
      severity: warning
    - id: posture.released
      label: Sovereign posture lifted
      severity: critical
    - id: routing.local
      label: Handled on-prem
      severity: info
    - id: agent.error
      label: Agent error
      severity: critical
  sink: logs/notifications.jsonl
